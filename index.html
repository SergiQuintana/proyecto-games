<style>
  :root { color-scheme: light dark; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#14171C; color:#E8EAEE;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
  .box { width:min(380px,88vw); background:#1D2128; border:1px solid #333947;
    border-radius:12px; padding:28px; }

  input { padding:11px 13px; border-radius:8px; border:1px solid #333947;
    background:#14171C; color:#E8EAEE; font-size:1rem; }
  input:focus { outline:2px solid #F0568A; outline-offset:1px; border-color:transparent; }
  button { padding:11px 13px; border:0; border-radius:8px; background:#F0568A;
    color:#14171C; font-weight:650; font-size:.95rem; cursor:pointer; }
  button:disabled { opacity:.6; cursor:progress; }
  .err { color:#ff8a8a; font-size:.85rem; min-height:1.2em; margin:0; }
</style>
<div class="box">

    <p class="err" id="e"></p>
  </form>
</div>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function unlock(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw),
    "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name:"PBKDF2", salt:b64(DATA.salt), iterations:DATA.iter, hash:"SHA-256" },
    base, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name:"AES-GCM", iv:b64(DATA.iv) },
    key, b64(DATA.ct));
  return new TextDecoder().decode(plain);
}

function render(html) {
  document.open(); document.write(html); document.close();
}

document.getElementById("f").addEventListener("submit", async ev => {
  ev.preventDefault();
  const btn = document.getElementById("b"), err = document.getElementById("e");
  btn.disabled = true; err.textContent = ""; btn.textContent = "Unlocking\u2026";
  try {
    const pw = document.getElementById("p").value;
    const html = await unlock(pw);
    try { sessionStorage.setItem("pg_pw", pw); } catch (e) {}
    render(html);
  } catch (e) {
    err.textContent = "Wrong password.";
    btn.disabled = false; btn.textContent = "Unlock";
  }
});

// Already unlocked this browser session (e.g. navigating from the board to a game)?
(async () => {
  let pw = null;
  try { pw = sessionStorage.getItem("pg_pw"); } catch (e) {}
  if (!pw) return;
  try { render(await unlock(pw)); } catch (e) {}
})();
